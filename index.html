<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d91" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0f1f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Suomi 200" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Suomi 200 — Finnish Words</title>
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <h1><span id="appTitle">Suomi 200</span> <span class="flag" id="appFlag" aria-hidden="true">🇫🇮</span></h1>
      <div class="lang-seg" id="langSeg" role="group" aria-label="Language">
        <button type="button" data-lang="fi" class="active"><span aria-hidden="true">🇫🇮</span> FI</button>
        <button type="button" data-lang="sv"><span aria-hidden="true">🇸🇪</span> SV</button>
        <button type="button" data-lang="svp" title="Swedish — in progress"><span aria-hidden="true">🇸🇪</span> WIP</button>
      </div>
    </div>
    <div class="svp-tabs" id="svpTabs" role="group" aria-label="In-progress study tabs" hidden>
      <button type="button" data-tab="svp1" class="active">Learn Today</button>
      <button type="button" data-tab="svpy">Yello</button>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" inputmode="search" placeholder="Search word, meaning, or #…" autocomplete="off" />
      <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
    </div>
    <div class="chips" id="chips" aria-label="Filter words">
      <button class="chip active" type="button" data-filter="all">All<span class="n"></span></button>
      <button class="chip" type="button" data-filter="selected">Selected<span class="n"></span></button>
      <button class="chip" type="button" data-filter="audio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Audio<span class="n"></span>
      </button>
    </div>
  </header>

  <main>
    <ul id="list" class="word-list" aria-live="polite"></ul>
    <p id="empty" class="empty-state" hidden>No matches.</p>
  </main>

  <footer class="selection-bar" id="selectionBar">
    <div class="mode-seg" id="modeSeg" role="group" aria-label="Playback mode">
      <button type="button" data-mode="listen" class="active" title="Word, then the meaning right away">Listen</button>
      <button type="button" data-mode="quiz" title="Word, then a pause to recall the meaning before the answer">Quiz</button>
      <button type="button" data-mode="produce" title="Meaning first, then a pause to say it in Finnish before the answer">Produce</button>
    </div>
    <div class="bar-row">
    <div class="np">
      <div class="np-word-row">
        <span class="np-word" id="npWord"></span>
        <span class="np-meta" id="npMeta"></span>
      </div>
      <div class="np-parts" id="npParts" aria-hidden="true">
        <span data-part="word">word</span>
        <span data-part="meaning">meaning</span>
        <span data-part="fi">FI</span>
        <span data-part="en">EN</span>
      </div>
    </div>
    <div class="sel-info">
      <strong id="selCount">0</strong> selected
    </div>
    <div class="sel-actions">
      <button id="selectAll" type="button" class="btn-ghost">Select all</button>
      <button id="clearSel" type="button" class="btn-ghost">Clear</button>
      <button id="npPrev" type="button" class="np-btn" aria-label="Previous word">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19 5l-10 7 10 7z" fill="currentColor"/></svg>
      </button>
      <button id="play" type="button" class="btn-play" disabled title="Audio coming in Phase 2">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        Play
      </button>
      <button id="npNext" type="button" class="np-btn" aria-label="Next word">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M5 5l10 7-10 7z" fill="currentColor"/></svg>
      </button>
    </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
